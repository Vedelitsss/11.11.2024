<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11.11.2024. 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<script>
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let stars = [];
let startTime = null;

// Загружаем 8 фотографий
const photos = [];

for (let i = 1; i <= 8; i++) {
    const img = new Image();
    img.src = "photo" + i + ".jpg";
    photos.push(img);
}

// Форма пиксельного сердца
const heartPattern = [
    "0001100000011000",
    "0011110000111100",
    "0111111001111110",
    "1111111111111111",
    "1111111111111111",
    "1111111111111111",
    "1111111111111111",
    "0111111111111110",
    "0011111111111100",
    "0001111111111000",
    "0000111111110000",
    "0000011111100000",
    "0000001111000000",
    "0000000110000000"
];

const heartPixels = [];

heartPattern.forEach((line, y) => {
    for (let x = 0; x < line.length; x++) {
        if (line[x] === "1") {
            heartPixels.push({
                x: (x - 8) * 6,
                y: (y - 7) * 6
            });
        }
    }
});

function random(min, max) {
    return min + Math.random() * (max - min);
}

function smooth(value) {
    value = Math.max(0, Math.min(1, value));
    return value * value * (3 - 2 * value);
}

// Размер экрана
function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * ratio;
    canvas.height = H * ratio;

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    stars = [];

    for (let i = 0; i < 230; i++) {
        stars.push({
            x: random(0, W),
            y: random(0, H),
            size: random(1, 2.5),
            phase: random(0, Math.PI * 2),
            speed: random(0.5, 2)
        });
    }
}

// Чёрный фон и звёзды
function drawBackground(time) {
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, W, H);

    stars.forEach(s => {
        const alpha = 0.2 + 0.8 *
            (0.5 + 0.5 * Math.sin(
                time / 1000 * s.speed + s.phase
            ));

        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    ctx.globalAlpha = 1;
}

// Пиксельное сердце
function drawHeart(x, y, scale, time, opacity = 1) {
    const pulse = 1 + Math.sin(time / 300) * 0.045;

    ctx.save();

    ctx.translate(x, y);
    ctx.scale(scale * pulse, scale * pulse);

    ctx.globalAlpha = opacity;
    ctx.shadowColor = "#ff65bd";
    ctx.shadowBlur = 25;

    heartPixels.forEach((p, i) => {
        ctx.fillStyle = i % 7 === 0
            ? "#ffe1f2"
            : "#f58ac8";

        ctx.fillRect(p.x, p.y, 6, 6);
    });

    ctx.restore();
    ctx.globalAlpha = 1;
}

// Маленькое сердце
function drawSmallHeart(x, y, time, opacity) {
    drawHeart(x, y, 0.25, time, opacity);
}

// Фотография
function drawPhoto(img, x, y, w, h, opacity) {
    ctx.save();

    ctx.globalAlpha = opacity;

    ctx.fillStyle = "#ffb7df";
    ctx.shadowColor = "#ff65bd";
    ctx.shadowBlur = 10;
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#211027";
    ctx.fillRect(x, y, w, h);

    if (img.complete && img.naturalWidth > 0) {
        const ratio = Math.max(
            w / img.naturalWidth,
            h / img.naturalHeight
        );

        const dw = img.naturalWidth * ratio;
        const dh = img.naturalHeight * ratio;

        ctx.save();

        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();

        ctx.drawImage(
            img,
            x + (w - dw) / 2,
            y + (h - dh) / 2,
            dw,
            dh
        );

        ctx.restore();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
}

// Галерея из 8 фотографий
function drawGallery(time, opacity) {

    const mobile = W < 600;

    const columns = 4;
    const gap = mobile ? 7 : 24;
    const margin = mobile ? 9 : 55;

    const cardW = Math.min(
        mobile ? 100 : 150,
        (W - margin * 2 - gap * 3) / 4
    );

    const cardH = mobile
        ? Math.min(75, H * 0.105)
        : Math.min(95, H * 0.12);

    const rowGap = mobile ? 22 : 38;

    const totalW = columns * cardW + gap * 3;
    const startX = (W - totalW) / 2;

    // Галерея располагается ниже надписи
    const startY = mobile ? H * 0.52 : H * 0.55;

    for (let i = 0; i < 8; i++) {

        const col = i % 4;
        const row = Math.floor(i / 4);

        const x = startX + col * (cardW + gap);
        const y = startY + row * (cardH + rowGap);

        const appear = smooth(
            (time - 8200 - i * 350) / 900
        );

        const a = opacity * appear;

        if (a <= 0) continue;

        const float = Math.sin(time / 500 + i) * 2;

        // Сердечко над фотографией
        drawSmallHeart(
            x + cardW / 2,
            y + 4 + float,
            time + i * 100,
            a
        );

        // Фотография
        drawPhoto(
            photos[i],
            x,
            y + 21 + float,
            cardW,
            cardH,
            a
        );
    }
}

// Дата и надпись
function drawText(time, dateOpacity, loveOpacity) {

    const mobile = W < 600;

    const dateY = mobile ? H * 0.34 : H * 0.40;
    const loveY = mobile ? H * 0.435 : H * 0.47;

    ctx.save();

    // Дата
    ctx.globalAlpha = dateOpacity;
    ctx.font = mobile ? "bold 21px monospace" : "bold 25px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffc4e7";

    ctx.shadowColor = "#ff55bb";
    ctx.shadowBlur = 15;

    ctx.fillText("11.11.2024.", W / 2, dateY);

    // Ich liebe dich!)
    ctx.globalAlpha = loveOpacity;
    ctx.font = mobile ? "bold 19px Arial" : "bold 24px Arial";
    ctx.fillStyle = "#ffc4e7";
    ctx.shadowColor = "#ff55bb";
    ctx.shadowBlur = 18;

    const pulse = 1 + Math.sin(time / 450) * 0.035;

    ctx.translate(W / 2, loveY);
    ctx.scale(pulse, pulse);

    ctx.fillText("Ich liebe dich!)", 0, 0);

    ctx.restore();
}

// Главная анимация
function animate(timestamp) {

    if (startTime === null) {
        startTime = timestamp;
    }

    const time = timestamp - startTime;

    drawBackground(time);

    const centerX = W / 2;

    // Сердце выше, чтобы освободить место
    const mobile = W < 600;
    const centerY = mobile ? H * 0.19 : H * 0.23;

    const baseSize = Math.min(W, H) / 440;

    // Два сердца соединяются
    const merge = smooth((time - 2500) / 3000);
    const distance = 105 * baseSize * (1 - merge);

    const twoOpacity = 1 - smooth((time - 5000) / 1000);

    if (twoOpacity > 0) {

        drawHeart(
            centerX - distance,
            centerY,
            baseSize * 0.85,
            time,
            twoOpacity
        );

        drawHeart(
            centerX + distance,
            centerY,
            baseSize * 0.85,
            time,
            twoOpacity
        );
    }

    // Одно большое сердце
    const singleOpacity = smooth((time - 5500) / 1100);

    if (singleOpacity > 0) {

        drawHeart(
            centerX,
            centerY,
            baseSize * 1.4,
            time,
            singleOpacity
        );
    }

    // Появление даты
    const dateOpacity = smooth((time - 6800) / 1000);

    // Появление надписи
    const loveOpacity = smooth((time - 7500) / 1200);

    // Появление галереи
    const galleryOpacity = smooth((time - 8200) / 1200);

    // Сначала фотографии
    if (galleryOpacity > 0) {
        drawGallery(time, galleryOpacity);
    }

    // Затем надписи: они всегда остаются поверх фотографий
    drawText(time, dateOpacity, loveOpacity);

    requestAnimationFrame(animate);
}

// Запуск
resize();

window.addEventListener("resize", resize);

requestAnimationFrame(animate);
</script>

</body>
</html>
